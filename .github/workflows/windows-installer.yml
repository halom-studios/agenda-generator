name: Build installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install application and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flet-cli==1.1.2
          pip install pyinstaller

      - name: Work around Flet CLI Windows binary-open bug
        shell: pwsh
        run: |
          $sourcePath = python -c "import importlib.util, pathlib; spec = importlib.util.find_spec('flet_cli.__pyinstaller.win_utils'); print(pathlib.Path(spec.origin) if spec and spec.origin else '')"
          if (-not $sourcePath -or -not (Test-Path $sourcePath)) {
            throw 'Could not locate flet_cli.__pyinstaller.win_utils in the installed Flet CLI.'
          }
          $source = Get-Content $sourcePath -Raw
          $buggy = 'open(exe_path, "ab", encoding="utf-8")'
          if (-not $source.Contains($buggy)) {
            throw "Expected Flet CLI 1.1.2 binary-open code was not found in $sourcePath; review this workaround."
          }
          $source = $source.Replace($buggy, 'open(exe_path, "ab")')
          Set-Content -Path $sourcePath -Value $source -Encoding utf8 -NoNewline

      - name: Package application
        run: flet pack --name GeradorAgenda --hidden-import odfdo --onedir --yes scripts/gui_agenda.py

      - name: Verify packaged executable
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/GeradorAgenda/GeradorAgenda.exe'
          if (-not (Test-Path $exe)) {
            throw "Packaged executable not found: $exe"
          }

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $iscc)) {
            $iscc = Join-Path $env:ProgramFiles 'Inno Setup 6/ISCC.exe'
          }
          if (-not (Test-Path $iscc)) {
            throw 'Inno Setup compiler (ISCC.exe) was not found.'
          }
          & $iscc 'scripts/installer_windows.iss'
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = 'dist/GeradorAgenda-Instalador-Windows.exe'
          if (-not (Test-Path $installer)) {
            throw "Installer not found: $installer"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GeradorAgenda-Windows-${{ github.sha }}
          path: |
            dist/GeradorAgenda-Instalador-Windows.exe
            dist/GeradorAgenda/
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: Intel
            runner: macos-15-intel
          - arch: Apple-Silicon
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Build macOS app and disk image
        env:
          MACOS_ARCH: ${{ matrix.arch }}
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt flet-cli==1.1.2 pyinstaller
          bash scripts/build_macos.sh

      - name: Verify installer
        run: test -s "dist/GeradorAgenda-Instalador-macOS-${{ matrix.arch }}.dmg"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeradorAgenda-macOS-${{ matrix.arch }}-${{ github.sha }}
          path: dist/GeradorAgenda-Instalador-macOS-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: GeradorAgenda-Windows-${{ github.sha }}
          path: release-assets

      - name: Download macOS installers
        uses: actions/download-artifact@v4
        with:
          pattern: GeradorAgenda-macOS-*-${{ github.sha }}
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/GeradorAgenda-Instalador-Windows.exe
            release-assets/GeradorAgenda-Instalador-macOS-*.dmg
