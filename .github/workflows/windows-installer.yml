name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Package application
        run: flet pack --name GeradorAgenda --hidden-import odfdo --onedir -y scripts/gui_agenda.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: iscc scripts/installer_windows.iss

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GeradorAgenda-Windows
          path: |
            dist/GeradorAgenda/**
            dist/GeradorAgenda-Instalador-Windows.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GeradorAgenda-Instalador-Windows.exe
