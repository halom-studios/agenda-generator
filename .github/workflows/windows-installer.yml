name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install application and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flet-cli==1.1.2
          pip install pyinstaller

      - name: Work around Flet CLI Windows binary-open bug
        shell: pwsh
        run: |
          $moduleDir = python -c "import flet_cli, pathlib; print(pathlib.Path(flet_cli.__file__).parent)"
          $sourcePath = Join-Path $moduleDir '__pyinstaller/win_utils.py'
          $source = Get-Content $sourcePath -Raw
          $buggy = 'open(exe_path, "ab", encoding="utf-8")'
          if (-not $source.Contains($buggy)) {
            throw "Expected Flet CLI 1.1.2 binary-open code was not found in $sourcePath; review this workaround."
          }
          $source = $source.Replace($buggy, 'open(exe_path, "ab")')
          Set-Content -Path $sourcePath -Value $source -Encoding utf8 -NoNewline

      - name: Package application
        run: flet pack --name GeradorAgenda --hidden-import odfdo --onedir --yes scripts/gui_agenda.py

      - name: Verify packaged executable
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/GeradorAgenda/GeradorAgenda.exe'
          if (-not (Test-Path $exe)) {
            throw "Packaged executable not found: $exe"
          }

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $iscc)) {
            $iscc = Join-Path $env:ProgramFiles 'Inno Setup 6/ISCC.exe'
          }
          if (-not (Test-Path $iscc)) {
            throw 'Inno Setup compiler (ISCC.exe) was not found.'
          }
          & $iscc 'scripts/installer_windows.iss'
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = 'dist/GeradorAgenda-Instalador-Windows.exe'
          if (-not (Test-Path $installer)) {
            throw "Installer not found: $installer"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GeradorAgenda-Windows-${{ github.sha }}
          path: |
            dist/GeradorAgenda-Instalador-Windows.exe
            dist/GeradorAgenda/
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GeradorAgenda-Instalador-Windows.exe
